name: Native Binaries

on:
  push:
    branches:
      - 'main'
    tags-ignore:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      macos-signing-policy:
        description: SignPath signing policy for the macOS binary (none leaves it unsigned)
        type: choice
        options:
          - none
          - untrusted-test-signing
          - apple-application-release
        default: untrusted-test-signing

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  native:
    uses: $/.github/workflows/reusable-native-build.yml
    permissions:
      actions: read # SignPath downloads the unsigned Windows binary, a workflow artifact
      contents: read
    with:
      artifact-retention-days: 7
      # Pull requests are not signed: forks and Dependabot have no access to the secret.
      signing-policy: ${{ github.event_name != 'pull_request' && 'test-signing' || '' }}
      # The macOS binary is signed through the SignPath macOS CryptoTokenKit (hash signing).
      # SignPath does not offer policies with origin verification for hash signing, so a push
      # signs it with untrusted-test-signing: a self-signed certificate, without trusted build
      # system verification. A run by hand can choose another policy, or none.
      macos-signing-policy: >-
        ${{ github.event_name == 'push' && 'untrusted-test-signing'
        || (github.event_name == 'workflow_dispatch' && inputs.macos-signing-policy != 'none'
        && inputs.macos-signing-policy || '') }}
    secrets:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
