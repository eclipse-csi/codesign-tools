name: Native Binaries

on:
  push:
    branches:
      - 'main'
    tags-ignore:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  native:
    uses: $/.github/workflows/reusable-native-build.yml
    permissions:
      actions: read # SignPath downloads the unsigned Windows binary, a workflow artifact
      contents: read
    with:
      artifact-retention-days: 7
      # Only a run by hand signs the binaries, to spare SignPath signing requests on each push
      # (pull requests could not anyway: forks and Dependabot have no access to the secret).
      signing-policy: ${{ github.event_name == 'workflow_dispatch' && 'test-signing' || '' }}
      # The macOS binary is signed through the SignPath macOS CryptoTokenKit (hash signing).
      # SignPath does not offer policies with origin verification for hash signing, hence
      # untrusted-test-signing: a self-signed certificate, without trusted build system
      # verification. Developer ID signing belongs to the release workflow, not to CI.
      macos-signing-policy: ${{ github.event_name == 'workflow_dispatch' && 'untrusted-test-signing' || '' }}
    secrets:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
