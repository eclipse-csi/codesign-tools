name: CI

on:
  push:
    branches:
      - 'main'
    tags-ignore:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-and-test:
    name: All Tests
    runs-on: ubuntu-latest

    permissions:
      security-events: write # Required to upload Trivy SARIF results to GitHub code scanning.
      actions: read # SignPath downloads the jars to test-sign, a workflow artifact, with GITHUB_TOKEN
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
            disable-sudo-and-containers: true
            egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags: the project version is derived from the closest vX.Y.Z
          # tag (.mvn/maven-git-versioning-extension.xml), and a shallow clone fails the build.
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Maven wrapper distribution
        uses: $/.github/actions/install-maven-wrapper

      - name: Set up SBOM tools
        uses: $/.github/actions/setup-sbom-tools
        with:
          github-token: ${{ github.token }}

      - name: Build and run tests
        run: ./mvnw -B -ntp -P integration-tests,generate-sbom verify

      - name: Expose Actions runtime for signing
        id: actions-runtime
        if: github.event_name != 'pull_request'
        uses: $/.github/actions/expose-actions-runtime

      # Smoke test of jar signing, until the build signs its own jars with the released Maven
      # plugin: the CLI just built submits each jar, as is, through the SignPath GitHub connector,
      # as the trusted build system verification of the Eclipse Foundation signing policies
      # requires. One invocation per jar, since several files would be submitted as one zip. Pull requests are not signed: forks and Dependabot have no access to
      # the secret. jarsigner exits 0 on unsigned jars and warns about the untrusted test
      # certificate, so its output is checked rather than its exit code.
      - name: Test-sign the jars with SignPath
        if: github.event_name != 'pull_request'
        env:
          CSI_CODESIGN_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          ACTIONS_RESULTS_URL: ${{ steps.actions-runtime.outputs.actions-results-url }}
          ACTIONS_RUNTIME_TOKEN: ${{ steps.actions-runtime.outputs.actions-runtime-token }}
        run: |
          shopt -s failglob
          cli_jar=(cli/target/codesign-cli-*-bin.jar)
          jars=(
            api/target/codesign-api-*.jar
            maven-plugin/target/codesign-maven-plugin-*.jar
            cli/target/csi-codesign-cli-*.jar
            "${cli_jar[@]}"
          )
          for jar in "${jars[@]}"; do
            java -jar "${cli_jar[0]}" sign \
              --submission-mode github-actions \
              --organization-id 46624a66-6595-48fd-85c3-64bdee7fecc9 \
              --project-id technology.csi \
              --signing-policy test-signing \
              --artifact-configuration jar-file \
              --output-dir target/signed-jars \
              "${jar}"
            signed="target/signed-jars/$(basename "${jar}")"
            echo "::group::jarsigner -verify ${signed}"
            output="$(jarsigner -verify -verbose -certs "${signed}")"
            echo "${output}"
            echo "::endgroup::"
            grep -q '^jar verified\.' <<< "${output}" || { echo "::error::${signed} is not signed"; exit 1; }
          done

      - name: Show WireMock log on failure
        if: failure()
        run: cat maven-plugin/target/wiremock.log 2>/dev/null || echo "(WireMock log not found)"

      # Trivy runs here rather than in ci-guardrails.yml because it scans the
      # CycloneDX SBOM produced by the Maven build (target/bom_all.json), which
      # contains the exact resolved dependency graph including transitives.
      # Scanning the SBOM is strictly more accurate than Trivy's own filesystem
      # heuristics, and the SBOM only exists after the build completes.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: sbom
          scan-ref: target/bom_all.json
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload Trivy SARIF file
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif
