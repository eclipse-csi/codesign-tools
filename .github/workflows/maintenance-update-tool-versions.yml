# We use this workflow (instead of Renovate) because Renovate requires installing a GitHub App,
# while this repository prefers a built-in scheduled updater with no additional app installation.
name: Update Pinned Tool Versions

on:
  schedule:
    - cron: '19 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  update-versions:
    name: Update pinned tool versions
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          disable-sudo-and-containers: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            files.pythonhosted.org:443
            releases.astral.sh:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Update versions manifest and hooks
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --project tools/github-workflow-tools --group prek ./.github/scripts/update-tool-versions.sh "${GITHUB_OUTPUT}"

      - name: Create or update pull request
        if: ${{ steps.update.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="ci/update-pinned-tool-versions"
          TITLE="ci: update pinned tool versions"
          BODY=$(cat <<'BODY_EOF'
          Automated update of pinned tool versions in:

          - `tools/github-workflow-tools/versions.json`
          - `prek.toml` (`minimum_prek_version` synced from `tools/github-workflow-tools/pyproject.toml`)
          - `prek.toml` (`defusedxml` pin synced from `tools/github-workflow-tools/pyproject.toml`)
          - `prek.toml` (via `prek auto-update --freeze`)

          This keeps workflow binaries and hook revisions current.
          BODY_EOF
          )

          # Configure git for commit and push
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git

          # Fetch the remote branch (if it exists) so --force-with-lease
          # has a valid baseline on this fresh checkout.
          git fetch origin "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" 2>/dev/null || true

          git checkout -B "${BRANCH}"
          git add -A
          git commit -m "${TITLE}"
          git push -u origin "${BRANCH}" --force-with-lease

          # Update existing PR or create a new one
          if gh pr view "${BRANCH}" --json state -q '.state' 2>/dev/null | grep -q "OPEN"; then
            gh pr edit "${BRANCH}" --title "${TITLE}" --body "${BODY}"
          else
            gh pr create --base main --head "${BRANCH}" --title "${TITLE}" --body "${BODY}"
          fi
