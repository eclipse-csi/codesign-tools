name: PRs Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  reviewdog-actionlint:
    name: reviewdog (actionlint)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # Required to post review comments
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          disable-sudo-and-containers: true
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      # astral-sh/actionlint publishes no releases: build the exact revision
      # pinned in prek.toml so CI and the local hook always agree.
      - name: Install actionlint
        shell: bash
        run: |
          # Read the pin line-by-line: prek.toml uses TOML 1.1 multi-line inline
          # tables, which the runner's Python tomllib (TOML 1.0) rejects.
          rev="$(grep -A1 -Fx 'repo = "https://github.com/astral-sh/actionlint"' prek.toml | sed -nE 's/^rev = "([0-9a-f]{40})".*/\1/p')"
          if [[ ! "${rev}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error file=prek.toml::Could not find the astral-sh/actionlint rev (expected right after its repo line)"
            exit 1
          fi
          go install "github.com/astral-sh/actionlint/cmd/actionlint@${rev}"
          actionlint -version

      - name: Setup reviewdog
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0

      - name: actionlint with reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          out="${RUNNER_TEMP}/actionlint.out"
          set +e
          actionlint -oneline > "${out}"
          status=$?
          set -e
          # 0 = clean, 1 = findings; 2 and 3 are actionlint failures, not findings.
          if [[ "${status}" -ge 2 ]]; then
            cat "${out}"
            exit "${status}"
          fi
          # Tag each finding with a reviewdog severity: ShellCheck's own level when present, error otherwise.
          sed -E 's/^(.*shellcheck reported issue in this script: SC[0-9]+:([ewin]).*)$/\2:\1/; t; s/^/e:/' "${out}" \
            | reviewdog -efm="%t:%f:%l:%c: %m" -name="actionlint" -reporter=github-pr-review -filter-mode=added -fail-level=error

  reviewdog-ruff:
    name: reviewdog (ruff)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # Required to post review comments
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          disable-sudo-and-containers: true
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Setup reviewdog
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0

      - name: ruff with reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run --project tools/github-workflow-tools --group reviewdog-ruff ruff check .github/scripts --output-format=rdjson \
            | reviewdog -f=rdjson -name="ruff" -reporter=github-pr-review -filter-mode=added -fail-level=error

  reviewdog-shellcheck:
    name: reviewdog (shellcheck)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # Required to post review comments
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          disable-sudo-and-containers: false # require sudo to install shellcheck
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup reviewdog
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck with reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          files="$(git ls-files '*.sh')"
          if [[ -z "${files}" ]]; then
            echo "No shell scripts to check."
            exit 0
          fi
          git ls-files '*.sh' | xargs shellcheck -f checkstyle \
            | reviewdog -f=checkstyle -name="shellcheck" -reporter=github-pr-review -filter-mode=added -fail-level=error

  reviewdog-prek:
    name: reviewdog (prek)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # Required to post review comments

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          disable-sudo-and-containers: true
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Run prek
        id: prek
        continue-on-error: true
        env:
          # poutine has a dedicated job in ci-guardrails.yml.
          # unit-tests/integration-tests are pre-push hooks and covered by ci.yml.
          # actionlint/ruff/shellcheck have dedicated reviewdog jobs above.
          # zizmor has a dedicated job in ci-guardrails.yml (with SARIF upload).
          # check-pom-consistency/check-hook-revisions-frozen have dedicated jobs in ci-guardrails.yml.
          # markdownlint has a dedicated reviewdog job above.
          SKIP: poutine,unit-tests,integration-tests,actionlint,ruff,shellcheck,zizmor,check-pom-consistency,check-hook-revisions-frozen,markdownlint
        run: uv run --project tools/github-workflow-tools --group prek prek run --all-files --show-diff-on-failure

      - name: Suggest fixes with reviewdog
        if: ${{ always() }}
        uses: reviewdog/action-suggester@fd22a83b1ebc13fd8aee5d57b06793fce6f20fb9 # v1.27.1
        with:
          tool_name: prek
          fail_on_error: "false"

      - name: Fail if prek found issues
        if: ${{ steps.prek.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::error::Prek checks failed. Run locally: prek run --all-files"
          exit 1

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Required to post comments
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          disable-sudo-and-containers: true
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml

  reviewdog-markdownlint:
    name: reviewdog (markdownlint)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # Required to post review comments
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          disable-sudo-and-containers: false # markdownlint needs to run in a container
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: markdownlint with reviewdog
        uses: reviewdog/action-markdownlint@584c3e89347d0b16ede47c73ae199550a02b1b37 # v0.33.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          filter_mode: added
          fail_level: error
          level: warning
