name: Native Build Reusable

on:
  workflow_call:
    inputs:
      artifact-retention-days:
        description: Artifact retention in days
        required: false
        type: number
        default: 7
      signing-policy:
        description: >-
          SignPath signing policy the Windows binary is signed with (test-signing or
          release-signing). Empty leaves the binaries unsigned.
        required: false
        type: string
        default: ''
    secrets:
      SIGNPATH_API_TOKEN:
        description: SignPath API token of the CI user, required when signing-policy is set.
        required: false

permissions: {}

jobs:
  native:
    name: Build native (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            jreleaser-platform: linux-x86_64
            binary: csi-codesign
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            jreleaser-platform: linux-aarch_64
            binary: csi-codesign
          - os: macos-latest
            platform: macos-aarch64
            jreleaser-platform: osx-aarch_64
            binary: csi-codesign
          - os: windows-latest
            platform: windows-x86_64
            jreleaser-platform: windows-x86_64
            binary: csi-codesign.exe

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    permissions:
      actions: read # SignPath downloads the unsigned binary, a workflow artifact, with GITHUB_TOKEN
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          disable-sudo-and-containers: true
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags: the project version is derived from the closest vX.Y.Z
          # tag (.mvn/maven-git-versioning-extension.xml), and a shallow clone fails the build.
          fetch-depth: 0

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@d6eca2595046623d69d636041513c80abf745406 # v1.6.9
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          native-image-job-reports: 'true'
          github-token: ${{ github.token }}

      - name: Install Maven wrapper distribution
        uses: $/.github/actions/install-maven-wrapper

      # MVNW_VERBOSE drops the --silent that the wrapper otherwise passes to
      # curl, so a failed distribution download reports the real curl error
      # instead of a bare "curl: Failed to fetch".
      #
      # The two Windows branches below both avoid CRL revocation checking, so a
      # rotated Let's Encrypt intermediate cannot break this job again even
      # though the allowed-endpoints above pin today's CRL hosts:
      #   1. Git ships an OpenSSL-based curl that performs no CRL lookup, unlike
      #      Windows' own Schannel curl.exe which hard-fails the handshake when
      #      the CRL host is unreachable. Putting Git's bin dir first makes the
      #      wrapper pick it up.
      #   2. Should that curl ever be absent from the runner image, mvnw.cmd
      #      downloads via System.Net.WebClient instead, and .NET does not check
      #      CRLs by default. It has to run the whole build rather than just the
      #      download, because mvnw.cmd hashes the distribution URL with SHA-256
      #      (mvnw.cmd:99) while mvnw uses a 32-bit string hash (mvnw:82-90), so
      #      the two resolve to different ~/.m2/wrapper/dists directories.
      - name: Build native binary
        shell: bash
        env:
          MVNW_VERBOSE: 'true'
        run: |
          set -- -B -ntp -Pnative -pl cli --also-make -DskipTests package
          if [ "$RUNNER_OS" = Windows ] && [ ! -x /mingw64/bin/curl.exe ]; then
            echo "Git's OpenSSL curl not found, building via mvnw.cmd (.NET downloader)"
            cmd //c "mvnw.cmd $*"
          else
            if [ "$RUNNER_OS" = Windows ]; then
              export PATH="/mingw64/bin:$PATH"
            fi
            command -v curl && curl --version | head -1
            ./mvnw "$@"
          fi

      - name: Expose Actions runtime for signing
        id: actions-runtime
        if: runner.os == 'Windows' && inputs.signing-policy != ''
        uses: $/.github/actions/expose-actions-runtime

      # The binary signs itself: csi-codesign submits it through the SignPath GitHub connector,
      # which the trusted build system verification of the Eclipse Foundation signing policies
      # requires. It writes elsewhere because Windows locks a running executable.
      - name: Sign Windows binary with SignPath
        if: runner.os == 'Windows' && inputs.signing-policy != ''
        shell: bash
        env:
          CSI_CODESIGN_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          ACTIONS_RESULTS_URL: ${{ steps.actions-runtime.outputs.actions-results-url }}
          ACTIONS_RUNTIME_TOKEN: ${{ steps.actions-runtime.outputs.actions-runtime-token }}
          SIGNING_POLICY: ${{ inputs.signing-policy }}
        run: |
          cli/target/csi-codesign.exe sign \
            --submission-mode github-actions \
            --organization-id 46624a66-6595-48fd-85c3-64bdee7fecc9 \
            --project-id technology.csi \
            --signing-policy "${SIGNING_POLICY}" \
            --artifact-configuration pe-file \
            --output cli/target/signed/csi-codesign.exe \
            cli/target/csi-codesign.exe
          mv -f cli/target/signed/csi-codesign.exe cli/target/csi-codesign.exe

      # The test certificate is not trusted by Windows, so only release-signed binaries have to
      # verify as Valid; any signature at all proves that the signing round trip worked.
      - name: Verify Authenticode signature
        if: runner.os == 'Windows' && inputs.signing-policy != ''
        shell: pwsh
        env:
          SIGNING_POLICY: ${{ inputs.signing-policy }}
        run: |
          $signature = Get-AuthenticodeSignature -FilePath cli/target/csi-codesign.exe
          $signature | Format-List Status, StatusMessage, SignerCertificate, TimeStamperCertificate
          if ($null -eq $signature.SignerCertificate) {
            throw 'csi-codesign.exe has no Authenticode signature'
          }
          if ($env:SIGNING_POLICY -eq 'release-signing' -and $signature.Status -ne 'Valid') {
            throw "Release signature of csi-codesign.exe is not valid: $($signature.StatusMessage)"
          }

      - name: Upload native binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: csi-codesign-${{ matrix.jreleaser-platform }}
          path: cli/target/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}
