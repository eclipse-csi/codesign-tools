name: Site

# Publishes the snapshot documentation for main.
#
# Release documentation is NOT published from here: it is published by the `publish-site`
# job of the Release workflow, once the release itself has actually succeeded. Tag pushes
# used to trigger this workflow directly, which lost release deploys to concurrency
# eviction and published documentation for tags whose release had failed. See
# reusable-site.yml for the details.
#
# To re-publish the documentation of an existing release, dispatch this workflow on that
# release's tag: `gh workflow run site.yml --ref vX.Y.Z`.

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

permissions: {}

jobs:
  site:
    name: Publish documentation site
    uses: ./.github/workflows/reusable-site.yml
    permissions:
      contents: write  # to maintain the gh-pages storage branch
      pages: write     # to deploy to GitHub Pages
      id-token: write  # OIDC token required by actions/deploy-pages
