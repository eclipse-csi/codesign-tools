# Signs files with csi-codesign uploading them directly to the SignPath REST API (the default
# "direct" submission mode). This only works with signing policies WITHOUT trusted build system
# verification: Eclipse Foundation policies reject it, use sign-with-action.yml instead.
#
# The same steps work on any CI system: download, verify, run.
#
# Copy to .github/workflows/ of your repository, and define:
#   - repository variables SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_ID, SIGNPATH_SIGNING_POLICY
#   - repository secret SIGNPATH_API_TOKEN (API token of the SignPath CI user)
name: Sign with csi-codesign (direct mode)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  CSI_CODESIGN_VERSION: 0.12.0

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      # Stands in for your build: makes two unsigned jars in dist/.
      - name: Build
        run: |
          mkdir -p dist content
          echo "Sample file signed by the Eclipse CSI codesign demos." > content/README.txt
          for name in app tools; do
            jar --create --file "dist/${name}.jar" -C content README.txt
          done

      # Checks the build provenance of the archive: it must have been built by the release
      # workflow of eclipse-csi/codesign-tools, from the tag of this version.
      - name: Install csi-codesign
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="csi-codesign-${CSI_CODESIGN_VERSION}-linux-x86_64.tar.gz"
          curl --fail --silent --show-error --location --remote-name \
            "https://github.com/eclipse-csi/codesign-tools/releases/download/v${CSI_CODESIGN_VERSION}/${archive}"
          gh attestation verify "$archive" \
            --repo eclipse-csi/codesign-tools \
            --signer-workflow eclipse-csi/codesign-tools/.github/workflows/release.yml \
            --source-ref "refs/tags/v${CSI_CODESIGN_VERSION}"
          mkdir -p "$RUNNER_TEMP/csi-codesign"
          tar -xzf "$archive" -C "$RUNNER_TEMP/csi-codesign"
          echo "$RUNNER_TEMP/csi-codesign" >> "$GITHUB_PATH"

      # Two files in ONE request, packed at the root of a zip file: hence a <zip-file> artifact
      # configuration.
      - name: Sign
        env:
          CSI_CODESIGN_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_ID: ${{ vars.SIGNPATH_PROJECT_ID }}
          SIGNPATH_SIGNING_POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY }}
        run: |
          csi-codesign sign dist/app.jar dist/tools.jar \
            --organization-id "$SIGNPATH_ORGANIZATION_ID" \
            --project-id "$SIGNPATH_PROJECT_ID" \
            --signing-policy "$SIGNPATH_SIGNING_POLICY" \
            --artifact-configuration jars-in-zip \
            --description "Build ${GITHUB_RUN_NUMBER} of ${GITHUB_REPOSITORY}" \
            --output-dir signed

      - name: Verify signatures
        # jarsigner -verify also succeeds on unsigned jars: check that it says "jar verified."
        run: |
          for jar in signed/*.jar; do
            out="$(jarsigner -verify "$jar")"
            echo "$jar: $out"
            grep -qF 'jar verified.' <<< "$out"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-jars
          path: signed/
