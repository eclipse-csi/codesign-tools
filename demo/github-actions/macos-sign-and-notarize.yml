# Signs a macOS app and its disk image with SignPath, through the SignPath macOS CryptoTokenKit,
# then notarizes the disk image and staples the ticket to it. csi-codesign installs and verifies
# the CryptoTokenKit, waits for the certificate, signs nested code from the inside out, checks
# every signature and stops the CryptoTokenKit again.
#
# The SignPath project needs a default artifact configuration of type "hash signing data", and
# the signing policy a Developer ID Application certificate: see
# ../signpath/README.md#macos-hash-signing.
#
# Copy to .github/workflows/ of your repository, and define:
#   - repository variables SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_ID, SIGNPATH_SIGNING_POLICY
#     and MACOS_SIGNING_IDENTITY (name of the certificate, e.g.
#     "Developer ID Application: Example AISBL (TEAMID)")
#   - repository secret SIGNPATH_API_TOKEN (API token of the SignPath CI user)
#   - repository secrets APPLE_NOTARY_KEY (content of the App Store Connect API key .p8 file),
#     APPLE_NOTARY_KEY_ID and APPLE_NOTARY_ISSUER, for notarization
name: Sign and notarize a macOS app

on:
  workflow_dispatch:

permissions: {}

env:
  # The first release with the `csi-codesign macos` commands.
  CSI_CODESIGN_VERSION: 0.12.0

jobs:
  build-sign-notarize:
    # csi-codesign is released for macOS on Apple Silicon.
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Stands in for your build (e.g. xcodebuild with CODE_SIGNING_ALLOWED=NO): compiles a
      # minimal, unsigned app bundle into build/.
      - name: Build
        run: |
          app=build/Sample.app
          mkdir -p "$app/Contents/MacOS"
          cat > "$app/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>Sample</string>
              <key>CFBundleIdentifier</key><string>org.eclipse.csi.codesign.demo</string>
              <key>CFBundleName</key><string>Sample</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
          </dict>
          </plist>
          EOF
          echo 'print("Sample app signed by the Eclipse CSI codesign demos.")' > main.swift
          swiftc -O -o "$app/Contents/MacOS/Sample" main.swift

      # Checks the build provenance of the archive: it must have been built by the release
      # workflow of eclipse-csi/codesign-tools, from the tag of this version.
      - name: Install csi-codesign
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="csi-codesign-${CSI_CODESIGN_VERSION}-osx-aarch_64.tar.gz"
          curl --fail --silent --show-error --location --remote-name \
            "https://github.com/eclipse-csi/codesign-tools/releases/download/v${CSI_CODESIGN_VERSION}/${archive}"
          gh attestation verify "$archive" \
            --repo eclipse-csi/codesign-tools \
            --signer-workflow eclipse-csi/codesign-tools/.github/workflows/release.yml \
            --source-ref "refs/tags/v${CSI_CODESIGN_VERSION}"
          mkdir -p "$RUNNER_TEMP/csi-codesign"
          tar -xzf "$archive" -C "$RUNNER_TEMP/csi-codesign"
          echo "$RUNNER_TEMP/csi-codesign" >> "$GITHUB_PATH"

      # Nested code first, the bundle last, with the hardened runtime and a secure timestamp.
      # The token reaches the CryptoTokenKit through its environment, never a command line.
      - name: Sign the app
        env:
          CSI_CODESIGN_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_ID: ${{ vars.SIGNPATH_PROJECT_ID }}
          SIGNPATH_SIGNING_POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        run: |
          csi-codesign macos sign build/Sample.app \
            --organization-id "$SIGNPATH_ORGANIZATION_ID" \
            --project-id "$SIGNPATH_PROJECT_ID" \
            --signing-policy "$SIGNPATH_SIGNING_POLICY" \
            --identity "$MACOS_SIGNING_IDENTITY" \
            --output-dir signed

      - name: Create the disk image
        run: hdiutil create -format UDZO -volname Sample -srcfolder signed/Sample.app signed/Sample.dmg

      - name: Sign the disk image
        env:
          CSI_CODESIGN_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_ID: ${{ vars.SIGNPATH_PROJECT_ID }}
          SIGNPATH_SIGNING_POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY }}
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        run: |
          csi-codesign macos sign signed/Sample.dmg \
            --organization-id "$SIGNPATH_ORGANIZATION_ID" \
            --project-id "$SIGNPATH_PROJECT_ID" \
            --signing-policy "$SIGNPATH_SIGNING_POLICY" \
            --identity "$MACOS_SIGNING_IDENTITY" \
            --force-overwrite

      # Notarization covers the app inside the disk image. On rejection, the log lists each issue
      # Apple found. Then the ticket is stapled and Gatekeeper must accept the disk image.
      - name: Notarize and staple
        env:
          CSI_CODESIGN_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          CSI_CODESIGN_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          CSI_CODESIGN_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: csi-codesign macos notarize signed/Sample.dmg

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sample-dmg
          path: signed/Sample.dmg
