# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

minimum_prek_version = "0.5.10"
default_install_hook_types = ["pre-commit", "pre-push"]

[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "0eb9e4a60caf04df64b499ed1e8bef55f4440eae" # frozen: v1.33.0
hooks = [
  { id = "zizmor" },
]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c" # frozen: v6.0.0
hooks = [
  { id = "check-merge-conflict" },
  { id = "check-yaml" },
  { id = "check-added-large-files" },
  { id = "detect-private-key" },
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace" },
  { id = "mixed-line-ending" },
]

# Astral's maintained fork of rhysd/actionlint. It publishes no tags, so this rev
# tracks its default branch (see .github/scripts/update-tool-versions.sh), and the
# reviewdog (actionlint) job in prs-review.yml builds this same revision.
[[repos]]
repo = "https://github.com/astral-sh/actionlint"
rev = "b524c8e879bd35356822b4506f62b6feab792eaf"
hooks = [
  { id = "actionlint", files = '^\.github/workflows/.*\.(yml|yaml)$' },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "9026c9127e153371d7a78dfcb0c45ae2046a3d10" # frozen: v0.17.6
hooks = [
  { id = "ruff", args = ["--fix"], files = '^\.github/scripts/.*\.py$' },
  { id = "ruff-format", files = '^\.github/scripts/.*\.py$' },
]

[[repos]]
repo = "https://github.com/igorshubovych/markdownlint-cli"
rev = "bf6d1792b8bc7f6cc93f10cc27735a4cb0c38e47" # frozen: v0.50.1
hooks = [
  { id = "markdownlint", args = ["--fix"] },
]

[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "a6564f5d57444e123433a5c9af733e3975c77229" # frozen: v0.11.0.1-1
hooks = [
  { id = "shellcheck", files = '^\.github/scripts/.*\.sh$' },
]

[[repos]]
repo = "https://github.com/macisamuele/language-formatters-pre-commit-hooks"
rev = "4380fbb73a154b5f5624794c1c78d9719ccc860f" # frozen: v2.16.0
hooks = [
  { id = "pretty-format-java", args = ["--autofix"], files = '(^|/)src/.*\.java$' },
]

[[repos]]
repo = "https://github.com/Yelp/detect-secrets"
rev = "01886c8a910c64595c47f186ca1ffc0b77fa5458" # frozen: v1.5.0
hooks = [
  { id = "detect-secrets", args = ["--disable-plugin", "HexHighEntropyString"] },
]

[[repos]]
repo = "https://github.com/betterleaks/betterleaks"
rev = "e07e69ba6a441313529b3e72be43ffdcc62bdf86" # frozen: v2.0.0-rc.9
hooks = [
  { id = "betterleaks" },
]

[[repos]]
repo = "https://github.com/trufflesecurity/trufflehog"
rev = "d232362a64a09a9e7d58267b8f5acef00ae90e23" # frozen: v3.100.0
hooks = [
  { id = "trufflehog", stages = ["manual"] },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "check-pom-consistency",
    name = "Check POM/dependabot consistency",
    language = "python",
    language_version = "python3",
    additional_dependencies = ["defusedxml==0.7.1"],
    entry = "python3 .github/scripts/check-pom-consistency.py",
    files = '^pom\.xml$|^\.github/dependabot\.yml$',
    pass_filenames = false,
  },
  {
    id = "check-hook-revisions-frozen",
    name = "Check hook revisions are frozen",
    language = "system",
    entry = "python3 .github/scripts/check-hook-revisions-frozen.py",
    files = '^prek\.toml$',
    pass_filenames = false,
  },
  {
    id = "poutine",
    name = "Analyze workflows (Poutine)",
    language = "system",
    entry = "poutine",
    args = ["analyze_local", ".", "--format", "pretty", "--fail-on-violation"],
    files = '^\.github/workflows/.*\.ya?ml$|^\.github/actions/.*\.ya?ml$',
    pass_filenames = false,
  },
  {
    id = "unit-tests",
    name = "Unit tests",
    language = "system",
    entry = "./mvnw",
    args = ["-B", "-ntp", "test"],
    files = '^api/src/|^cli/src/|^maven-plugin/src/|(^|/)pom\.xml$',
    pass_filenames = false,
    stages = ["pre-push"],
  },
  {
    id = "integration-tests",
    name = "Integration tests",
    language = "system",
    entry = "./mvnw",
    args = ["-B", "-ntp", "-DskipTests", "-Pintegration-tests", "verify"],
    files = '^maven-plugin/src/.*\.java$|^maven-plugin/src/it/|^maven-plugin/pom\.xml$',
    pass_filenames = false,
    stages = ["pre-push"],
  },
]
